# Settings of the project. Every script reads them from here; run everything with: uv run python -m src.pipeline

data:
  # Where to start. The chosen step is downloaded from our server, every step after it is computed:
  #   raw                the Lichess month, nothing downloaded: compute steps 1-3
  #   01_selection       the games after step 1: compute steps 2-3
  #   02_preprocessing   the move tables after step 2: compute step 3
  #   03_transformation  the tables after step 3, ready for the models
  start_with: raw
  also_download: []          # earlier steps to download as well, to look at them, e.g. [01_selection]
  raw_from: lichess           # the raw month: lichess (public, about 30 GB) or server (our copy, needs the keys in .env)
  stockfish: download        # Stockfish columns in step 2: download (our results) or compute (about 250 core-hours)

workers: 16                  # parallel processes, at most the number of cores

# ---------------------------------------------------------------------------------------------------------------
# Fixed settings of the method: no longer read from here, the code takes them from src/settings.py.
# Kept as comments for now; to be deleted.
# ---------------------------------------------------------------------------------------------------------------
# seed: 42
# month: "2026-09"             # rated standard games of September 2026
#
# filters:                     # step 1: complete cases
#   speeds: [bullet, blitz, rapid, classical]
#   terminations: [Normal, Time forfeit]
#
# selection:                   # step 1: a group is speed x mean Elo, a bucket is speed x mover's Elo x time left
#   n_games: 350000            # training + test games
#   test_frac: 0.20            # share of test games in every group
#   elo_bin: 250
#   elo_min: 500
#   elo_max: 2000
#   window: 30                 # time left in 30 s steps, up to:
#   window_max: {bullet: 120, blitz: 300, rapid: 900, classical: 1800}
#   min_games: 100             # buckets with fewer games are marked as uncertain
#   pool_rate: 0.10            # share of the complete games kept to draw the selections from
#   check_draws: 20            # fresh draws that show how far a selection strays from the month by chance
#
# features:                    # step 2: what is known before the move
#   recent_moves: 5            # moves for the recent averages
#   eco_from_ply: 12           # the opening letter only from this ply on
#   marks: {inaccuracy: 0.05, mistake: 0.10, blunder: 0.15}   # loss in win probability of Lichess's marks
#
# engine:                      # step 2: Stockfish on the position before every move
#   top: {limit: {depth: 10}, lines: 5}   # the best 5 moves
#   worst: {limit: {depth: 4}}            # every legal move, for the worst 5
#
# transformation:              # step 3
#   valid_frac: 0.10           # training games held out to choose between runs
#
# tuning:                      # step 4
#   sampler: tpe               # tpe or grid
#   objective: log_loss
