# Settings of the data selection. Every script reads them from here (src/config.py).
seed: 42
workers: 16                  # processes that parse the games; the environment variable IE500_WORKERS overrides it

source:
  # The raw monthly files of database.lichess.org (rated standard games), unchanged, on the team's read-only S3
  # storage (copies of 2026-08 and 2026-09, checked against Lichess's sha256 sums). Endpoint, bucket and keys
  # come from .env (a copy of .env.example).
  month: "2026-09"
  key: lichess_db_standard_rated_{month}.pgn.zst

filters:                     # complete cases (src/lichess/pgn.py)
  speeds: [bullet, blitz, rapid, classical]      # ultrabullet and correspondence are dropped
  terminations: [Normal, Time forfeit]           # abandoned games and rule infractions are dropped
  min_plies: 20                                  # at least 10 moves by each player

selection:
  # Group of a game: speed x Elo of the mean of both ratings. Bucket of a move: speed x Elo of the mover x the
  # mover's time left before the move. See src/preprocessing/selection/.
  n_games: 350000            # training + test games
  test_frac: 0.20            # share of test games inside every group
  elo_bin: 250               # Elo bins: below 750, 750-1000, ..., 1750-2000, 2000 and above
  elo_min: 500
  elo_max: 2000
  window: 30                 # time left in 30 s steps ...
  window_max: {bullet: 120, blitz: 300, rapid: 900, classical: 1800}   # ... up to the usual longest start (last step open)
  min_games: 100             # buckets with fewer games are kept but marked as uncertain
  candidate_rate: 0.10       # complete games with a random number below this are kept by the census: n_games needs
                             # about 4% of them, the rest are the replacement games of the balancing
  balance: false             # swap games until every bucket's blunder probability equals the month's. This picks
                             # games by their label, so it is off: the plain stratified draw is checked against the
                             # month instead (src/preprocessing/bucket_rates/selection_check.py)
  check_draws: 20            # random stratified draws that show how far a selection may stray from the month by chance

features:
  # One row per move of the selected games, with what is known before the move is played
  # (src/preprocessing/features/positions.py).
  recent_moves: 5            # the mover's last moves for the recent averages (loss, time spent)
  marks: {inaccuracy: 0.05, mistake: 0.10, blunder: 0.15}   # loss in win probability (0-1) of Lichess's marks,
                             # used to classify the engine's candidate moves

engine:
  # Stockfish on the position before every move (src/preprocessing/features/engine.py). The program is the
  # environment variable STOCKFISH_PATH, else `path` (a name on PATH or a file).
  path: stockfish
  limit: {depth: 10}         # per position, python-chess chess.engine.Limit, e.g. {nodes: 100000}
  multipv: all               # all legal moves ranked (best 5, worst 5, share of losing moves), or a number such as 5
  threads: 1                 # per engine; one engine per worker process
  hash_mb: 16
  games: {train: 5000, test: 2000}   # random games per part to analyse; null = every game of the part
  batch: 50                  # games per output file, so that a stopped run continues where it was

training:
  valid_frac: 0.10           # training games held out, by game, for early stopping and choosing between runs
  max_train_games: null      # random subset of the training games for a quick run; null = all
