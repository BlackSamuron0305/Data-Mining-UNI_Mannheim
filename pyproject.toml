[project]
name = "data-mining-uni-mannheim"
version = "0.1.0"
description = "IE500 Data Mining, Team 5: Predicting Blunders in Online Chess"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.44.4",
    "botocore>=1.44.4",
    "chess>=1.11.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "optuna>=5.1.0",
    "pandas>=3.1.0,!=3.1.1",
    "pyarrow>=26.0.0,!=26.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "urllib3>=2.8.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
